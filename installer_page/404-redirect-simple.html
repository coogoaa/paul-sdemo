<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Installer Workspace Moved - GreenSketch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Noto Sans", sans-serif; }
    .glass-card { backdrop-filter: blur(18px); background: rgba(255, 255, 255, 0.92); }
    .shadow-soft { box-shadow: 0 18px 45px -24px rgba(34, 197, 94, 0.35); }
  </style>
</head>
<body class="bg-[#F4FFFB] text-gray-800 min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-2xl">
    <div class="glass-card shadow-soft rounded-3xl p-12 lg:p-16 border border-white/60 text-center">
      <!-- Title -->
      <h1 class="text-3xl lg:text-4xl font-semibold text-gray-900 mb-6">
        The Installer Workspace has Moved!
      </h1>

      <!-- Description -->
      <p class="text-base lg:text-lg text-gray-600 leading-relaxed mb-10">
        To streamline your experience, all Sales Agent configurations are now managed directly within your GreenSketch account.<br class="hidden sm:block" />
        Please log in to GreenSketch and navigate to the "Emily's Smart Quote" menu to update your settings.
      </p>

      <!-- CTA Button -->
      <a href="https://gs.onesimpleway.com/au/leads-capture" class="inline-block rounded-xl bg-[#22C55E] hover:bg-[#16A34A] text-white px-8 py-4 text-base font-semibold transition shadow-lg hover:shadow-xl">
        Go to GreenSketch Login
      </a>
    </div>
  </div>
</body>
</html>
