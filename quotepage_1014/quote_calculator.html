<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光伏报价计算器 - 1014版</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .config-section { border: 1px solid #dee2e6; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .sticky-top-custom { position: sticky; top: 20px; max-height: calc(100vh - 40px); overflow-y: auto; }
        .result-card { border: 1px solid #dee2e6; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .detail-table { font-size: 0.85rem; }
        .detail-table th { background-color: #f8f9fa; }
        #leftPanel { font-size: 0.9rem; }
        .calculation-step { border-left: 3px solid #007bff; padding-left: 15px; margin-bottom: 20px; }
        .formula-box { background-color: #f8f9fa; border: 1px solid #dee2e6; border-radius: 5px; padding: 10px; font-family: monospace; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div id="leftPanel" class="col-md-3 sticky-top-custom">
                <h4 class="mb-3">输入参数</h4>
                <div class="alert alert-secondary py-2 px-3 mb-3">
                    <strong>模式：</strong>
                    <select id="modeSelector" class="form-select form-select-sm mt-2">
                        <option value="new">新建系统</option>
                        <option value="retrofit">储能扩容</option>
                    </select>
                </div>
                <div class="config-section">
                    <h6>上游输入</h6>
                    <div class="mb-2">
                        <label>屋顶最大装机容量 (kW)</label>
                        <input type="number" id="roof_max_power_kw" class="form-control form-control-sm" value="20" step="0.1">
                    </div>
                </div>
                <div class="config-section section-new">
                    <h6>新建系统 - 方案参数</h6>
                    <div class="alert alert-info py-2 px-3 mb-2 small">
                        <strong>说明：</strong>A/B/C三个方案使用相同的光伏容量系数。只有C方案需要目标自用率来计算电池容量。
                    </div>
                    <div class="row g-2">
                        <div class="col-12"><label class="form-label small">光伏容量系数（A/B/C共用）</label><input type="number" id="plan_c_capacity_factor" class="form-control form-control-sm" value="0.9" step="0.1"></div>
                        <div class="col-12"><label class="form-label small">C方案目标自用率</label><input type="number" id="plan_c_target_sc_rate" class="form-control form-control-sm" value="0.8" step="0.1"></div>
                        <div class="col-12"><label class="form-label small">GS电池补偿系数（>20kW时）</label><input type="number" id="gs_battery_factor" class="form-control form-control-sm" value="1.3" step="0.1"></div>
                    </div>
                </div>
                <div class="config-section">
                    <h6>技术参数</h6>
                    <div class="mb-2"><label class="small">单块面板功率 (kW)</label><input type="number" id="panel_power_kw" class="form-control form-control-sm" value="0.44" step="0.01"></div>
                    <div class="mb-2"><label class="small">容配比 (DC/AC)</label><input type="number" id="dc_ac_ratio" class="form-control form-control-sm" value="1.5" step="0.01"></div>
                    <div class="mb-2"><label class="small">基线自用率</label><input type="number" id="baseline_self_consumption_rate" class="form-control form-control-sm" value="0.3" step="0.01"></div>
                    <div class="mb-2"><label class="small">电池DoD</label><input type="number" id="battery_dod" class="form-control form-control-sm" value="0.9" step="0.01"></div>
                    <div class="mb-2"><label class="small">电池RTE</label><input type="number" id="battery_rte" class="form-control form-control-sm" value="0.95" step="0.01"></div>
                    <div class="mb-2"><label class="small">年发电量/kW (kWh)</label><input type="number" id="yield_per_kw_per_year" class="form-control form-control-sm" value="1526" step="1"></div>
                </div>
                <div class="config-section section-new">
                    <h6>成本与利润率</h6>
                    <div class="mb-2"><label class="small">面板单价 (AUD/块)</label><input type="number" id="panel_unit_cost" class="form-control form-control-sm" value="80" step="1"></div>
                    <div class="mb-2"><label class="small">逆变器单价 (AUD/kW)</label><input type="number" id="inverter_unit_cost_per_kw" class="form-control form-control-sm" value="200" step="1"></div>
                    <div class="mb-2"><label class="small">电池单价 (AUD/kWh)</label><input type="number" id="battery_unit_cost_per_kwh" class="form-control form-control-sm" value="320" step="1"></div>
                    <div class="mb-2"><label class="small">安装基础费 (AUD)</label><input type="number" id="install_base_cost" class="form-control form-control-sm" value="1000" step="10"></div>
                    <div class="mb-2"><label class="small">安装单价 (AUD/kW)</label><input type="number" id="install_cost_per_kw" class="form-control form-control-sm" value="150" step="1"></div>
                    <div class="mb-2"><label class="small">面板利润率</label><input type="number" id="panel_profit_margin" class="form-control form-control-sm" value="0.3" step="0.01"></div>
                    <div class="mb-2"><label class="small">逆变器利润率</label><input type="number" id="inverter_profit_margin" class="form-control form-control-sm" value="0.3" step="0.01"></div>
                    <div class="mb-2"><label class="small">电池利润率</label><input type="number" id="battery_profit_margin" class="form-control form-control-sm" value="0.3" step="0.01"></div>
                    <div class="mb-2"><label class="small">安装基础费利润率</label><input type="number" id="install_base_profit_margin" class="form-control form-control-sm" value="0.3" step="0.01"></div>
                    <div class="mb-2"><label class="small">安装单价利润率</label><input type="number" id="install_cost_per_kw_profit_margin" class="form-control form-control-sm" value="0.3" step="0.01"></div>
                    <div class="mb-2"><label class="small">电池安装基础费 (AUD)</label><input type="number" id="battery_install_base_cost" class="form-control form-control-sm" value="1000" step="10"></div>
                    <div class="mb-2"><label class="small">电池安装单价 (AUD/kWh)</label><input type="number" id="battery_install_cost_per_kwh" class="form-control form-control-sm" value="250" step="1"></div>
                    <div class="mb-2"><label class="small">电池安装基础费利润率</label><input type="number" id="battery_install_base_profit_margin" class="form-control form-control-sm" value="0.3" step="0.01"></div>
                    <div class="mb-2"><label class="small">电池安装单价利润率</label><input type="number" id="battery_install_cost_per_kwh_profit_margin" class="form-control form-control-sm" value="0.3" step="0.01"></div>
                </div>
                <div class="config-section section-new">
                    <h6>补贴参数</h6>
                    <div class="mb-2"><label class="small">STC地区倍率</label><input type="number" id="stc_zone_rating" class="form-control form-control-sm" value="1.382" step="0.001"></div>
                    <div class="mb-2"><label class="small">STC折算年数</label><input type="number" id="stc_deeming_period_years" class="form-control form-control-sm" value="6" step="1"></div>
                    <div class="mb-2"><label class="small">面板STC单价 (AUD)</label><input type="number" id="pv_stc_price_default" class="form-control form-control-sm" value="40" step="1"></div>
                    <div class="mb-2"><label class="small">电池STC系数 (STCs/kWh)</label><input type="number" id="stc_factor_per_kwh_battery" class="form-control form-control-sm" value="9.3" step="0.1"></div>
                    <div class="mb-2"><label class="small">电池STC单价 (AUD)</label><input type="number" id="battery_stc_price_default" class="form-control form-control-sm" value="40" step="1"></div>
                    <div class="mb-2"><label class="small">最大STC系统容量 (kW)</label><input type="number" id="max_stc_system_kw" class="form-control form-control-sm" value="100" step="1"></div>
                    <div class="mb-2"><label class="small">VIC州PV补贴 (AUD)</label><input type="number" id="solar_vic_rebate" class="form-control form-control-sm" value="1400" step="10"></div>
                    <div class="mb-2"><label class="small">VIC州无息贷款 (AUD)</label><input type="number" id="solar_vic_pv_interest_free_loan" class="form-control form-control-sm" value="1400" step="10"></div>
                    <div class="mb-2"><label class="small">其他政府补贴 (AUD)</label><input type="number" id="other_gov_subsidy" class="form-control form-control-sm" value="0" step="10"></div>
                    <div class="mb-2"><label class="small">其他补贴 (AUD)</label><input type="number" id="other_subsidy" class="form-control form-control-sm" value="0" step="10"></div>
                </div>
                <div class="config-section">
                    <h6>通用参数</h6>
                    <div class="mb-2"><label class="small">GST税率</label><input type="number" id="gst_rate" class="form-control form-control-sm" value="0.1" step="0.01"></div>
                    <div class="mb-2"><label class="small">安装商附加费 (AUD)</label><input type="number" id="installer_additional_fee" class="form-control form-control-sm" value="0" step="10"></div>
                </div>
                <div class="config-section">
                    <h6>NPV计算参数</h6>
                    <div class="mb-2"><label class="small">电价 (AUD/kWh)</label><input type="number" id="electricity_rate" class="form-control form-control-sm" value="0.25" step="0.01"></div>
                    <div class="mb-2"><label class="small">上网电价 (AUD/kWh)</label><input type="number" id="feed_in_tariff" class="form-control form-control-sm" value="0.05" step="0.01"></div>
                    <div class="mb-2"><label class="small">电价年增长率</label><input type="number" id="electricity_escalation" class="form-control form-control-sm" value="0.03" step="0.01"></div>
                    <div class="mb-2"><label class="small">贴现率</label><input type="number" id="discount_rate" class="form-control form-control-sm" value="0.05" step="0.01"></div>
                    <div class="mb-2"><label class="small">项目年限</label><input type="number" id="project_years" class="form-control form-control-sm" value="25" step="1"></div>
                    <div class="mb-2"><label class="small">系统年衰减率</label><input type="number" id="system_degradation" class="form-control form-control-sm" value="0.005" step="0.001"></div>
                </div>
                <div class="config-section section-retrofit" style="display:none;">
                    <h6>储能扩容参数</h6>
                    <div class="mb-2"><label class="small">屋顶使用系数</label><input type="number" id="rooftop_use_factor" class="form-control form-control-sm" value="0.7" step="0.01"></div>
                </div>
                <button class="btn btn-primary w-100 mt-3" onclick="calculate()">重新计算</button>
            </div>
            <div id="middlePanel" class="col-md-5">
                <h4 class="mb-3">计算过程详解</h4>
                <div class="d-flex gap-2 mb-3">
                    <select id="planSelector" class="form-select form-select-sm" style="width:auto">
                        <option value="A">方案A</option>
                        <option value="B">方案B</option>
                        <option value="C">方案C</option>
                    </select>
                </div>
                <div id="calculationSteps"></div>
            </div>
            <div id="rightPanel" class="col-md-4">
                <h4 class="mb-3">计算结果</h4>
                <div id="resultsContainer"></div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const GS_MAPPING = [
            { min: 0, max: 5, battery: 20.2, inverter: 8 },
            { min: 5, max: 7.5, battery: 20, inverter: 9.6 },
            { min: 7.5, max: 12, battery: 26.4, inverter: 9.994 },
            { min: 12, max: 20, battery: 25.24, inverter: 9.3 }
        ];
        const GD_MAPPING = [
            { min: 0, max: 5, battery: 13.5, inverter: 5 },
            { min: 5, max: 7.5, battery: 13.34, inverter: 5 },
            { min: 7.5, max: 12, battery: 15.6, inverter: 7.22 },
            { min: 12, max: 20, battery: 20, inverter: 10 },
            { min: 20, max: 100, battery: 37.74, inverter: 15 }
        ];
        const RETROFIT_MAPPING = [
            { min: 0, max: 5, a: 10, b: 13.5, c: 15 },
            { min: 5, max: 7.5, a: 10, b: 13.5, c: 19.2 },
            { min: 7.5, max: 12, a: 13.8, b: 16, c: 23.4 },
            { min: 12, max: 20, a: 19.2, b: 23.4, c: 30 },
            { min: 20, max: 100, a: 30, b: 43, c: 50 }
        ];

        function getVal(id) {
            const el = document.getElementById(id);
            return el ? parseFloat(el.value) || 0 : 0;
        }

        function findMapping(arr, kw) {
            for (let i = 0; i < arr.length; i++) {
                if (kw > arr[i].min && kw <= arr[i].max) return arr[i];
            }
            return arr[arr.length - 1];
        }

        function calculateNPV(annualGeneration, selfConsumptionRate, initialInvestment) {
            const electricityRate = getVal('electricity_rate');
            const feedInTariff = getVal('feed_in_tariff');
            const escalation = getVal('electricity_escalation');
            const discountRate = getVal('discount_rate');
            const projectYears = getVal('project_years');
            const degradation = getVal('system_degradation');
            
            let npv = -initialInvestment;
            let cumulativeCashFlow = -initialInvestment;
            let paybackYears = projectYears;
            let totalSavings = 0;
            
            for (let year = 1; year <= projectYears; year++) {
                const yearlyGeneration = annualGeneration * Math.pow(1 - degradation, year - 1);
                const selfConsumed = yearlyGeneration * selfConsumptionRate;
                const exported = yearlyGeneration * (1 - selfConsumptionRate);
                const currentElectricityRate = electricityRate * Math.pow(1 + escalation, year - 1);
                const currentFeedInTariff = feedInTariff * Math.pow(1 + escalation, year - 1);
                
                const annualSavings = selfConsumed * currentElectricityRate + exported * currentFeedInTariff;
                const discountedSavings = annualSavings / Math.pow(1 + discountRate, year);
                
                npv += discountedSavings;
                cumulativeCashFlow += annualSavings;
                totalSavings += annualSavings;
                
                if (cumulativeCashFlow >= 0 && paybackYears === projectYears) {
                    paybackYears = year - 1 + (initialInvestment - (cumulativeCashFlow - annualSavings)) / annualSavings;
                }
            }
            
            return { npv, paybackYears, totalSavings };
        }

        function calculate() {
            const mode = document.getElementById('modeSelector').value;
            if (mode === 'new') {
                calculateNewSystem();
            } else {
                calculateRetrofit();
            }
        }

        function calculateNewSystem() {
            const roofMaxPower = getVal('roof_max_power_kw');
            const panelPower = getVal('panel_power_kw');
            const dcAcRatio = getVal('dc_ac_ratio');
            const baselineSc = getVal('baseline_self_consumption_rate');
            const batteryDod = getVal('battery_dod');
            const batteryRte = getVal('battery_rte');
            const yieldPerKw = getVal('yield_per_kw_per_year');
            
            // A/B/C三个方案使用相同的容量系数
            const capacityFactor = getVal('plan_c_capacity_factor');
            const targetScC = getVal('plan_c_target_sc_rate');
            
            const plans = {
                A: { type: 'GS' },
                B: { type: 'GD' },
                C: { type: 'CALC', sc: targetScC }
            };

            const results = {};
            Object.entries(plans).forEach(([key, p]) => {
                const solarKw = roofMaxPower * capacityFactor;
                const panelCount = Math.floor(solarKw / panelPower);
                const annualGeneration = solarKw * yieldPerKw;
                
                let inverterKw, usableBattery;
                if (p.type === 'GS') {
                    const map = findMapping(GS_MAPPING, solarKw);
                    inverterKw = map.inverter;
                    usableBattery = map.battery;
                    if (solarKw > 20) usableBattery *= getVal('gs_battery_factor') || 1.3;
                } else if (p.type === 'GD') {
                    const map = findMapping(GD_MAPPING, solarKw);
                    inverterKw = map.inverter;
                    usableBattery = map.battery;
                } else {
                    inverterKw = Math.ceil((solarKw / dcAcRatio) * 10) / 10;
                    const dailyShift = (annualGeneration / 365) * (p.sc - baselineSc);
                    usableBattery = Math.min(dailyShift / batteryRte, 50);
                }
                
                const nominalBattery = usableBattery / batteryDod;
                
                const panelUnitCost = getVal('panel_unit_cost');
                const inverterUnitCostPerKw = getVal('inverter_unit_cost_per_kw');
                const batteryUnitCostPerKwh = getVal('battery_unit_cost_per_kwh');
                const installBaseCost = getVal('install_base_cost');
                const installCostPerKw = getVal('install_cost_per_kw');
                const panelMargin = getVal('panel_profit_margin');
                const inverterMargin = getVal('inverter_profit_margin');
                const batteryMargin = getVal('battery_profit_margin');
                const installBaseMargin = getVal('install_base_profit_margin');
                const installPerKwMargin = getVal('install_cost_per_kw_profit_margin');
                const batteryInstallBaseCost = getVal('battery_install_base_cost');
                const batteryInstallCostPerKwh = getVal('battery_install_cost_per_kwh');
                const batteryInstallBaseMargin = getVal('battery_install_base_profit_margin');
                const batteryInstallPerKwhMargin = getVal('battery_install_cost_per_kwh_profit_margin');
                
                const panelLineCost = panelUnitCost * panelCount;
                const panelLinePrice = panelLineCost * (1 + panelMargin);
                const inverterLineCost = inverterKw * inverterUnitCostPerKw;
                const inverterLinePrice = inverterLineCost * (1 + inverterMargin);
                const batteryLineCost = nominalBattery * batteryUnitCostPerKwh;
                const batteryLinePrice = batteryLineCost * (1 + batteryMargin);
                
                const keyProductsTotalCost = panelLineCost + inverterLineCost + batteryLineCost;
                const keyProductsTotalPrice = panelLinePrice + inverterLinePrice + batteryLinePrice;
                
                const installBaseLineCost = installBaseCost;
                const installBaseLinePrice = installBaseLineCost * (1 + installBaseMargin);
                const installPerKwLineCost = solarKw * installCostPerKw;
                const installPerKwLinePrice = installPerKwLineCost * (1 + installPerKwMargin);
                const batteryInstallBaseLineCost = batteryInstallBaseCost;
                const batteryInstallBaseLinePrice = batteryInstallBaseLineCost * (1 + batteryInstallBaseMargin);
                const batteryInstallPerKwhLineCost = nominalBattery * batteryInstallCostPerKwh;
                const batteryInstallPerKwhLinePrice = batteryInstallPerKwhLineCost * (1 + batteryInstallPerKwhMargin);
                
                const bosTotalCost = installBaseLineCost + installPerKwLineCost + batteryInstallBaseLineCost + batteryInstallPerKwhLineCost;
                const bosTotalPrice = installBaseLinePrice + installPerKwLinePrice + batteryInstallBaseLinePrice + batteryInstallPerKwhLinePrice;
                
                const additionalCharges = getVal('installer_additional_fee');
                const gstRate = getVal('gst_rate');
                
                const systemTotalPriceBeforeGst = keyProductsTotalPrice + bosTotalPrice + additionalCharges;
                const systemTotalCostBeforeGst = keyProductsTotalCost + bosTotalCost + additionalCharges;
                const gstPrice = systemTotalPriceBeforeGst * gstRate;
                const gstCost = systemTotalCostBeforeGst * gstRate;
                const systemTotalPrice = systemTotalPriceBeforeGst + gstPrice;
                const systemTotalCost = systemTotalCostBeforeGst + gstCost;
                
                const stcZoneRating = getVal('stc_zone_rating');
                const stcDeemingYears = getVal('stc_deeming_period_years');
                const maxStcSystemKw = getVal('max_stc_system_kw');
                const pvStcPrice = getVal('pv_stc_price_default');
                const batteryStcFactor = getVal('stc_factor_per_kwh_battery');
                const batteryStcPrice = getVal('battery_stc_price_default');
                const solarVicRebate = getVal('solar_vic_rebate');
                const solarVicLoan = getVal('solar_vic_pv_interest_free_loan');
                const otherGovSubsidy = getVal('other_gov_subsidy');
                const otherSubsidy = getVal('other_subsidy');
                
                const pvStcCount = Math.floor(Math.min(solarKw, maxStcSystemKw) * stcZoneRating * stcDeemingYears);
                const pvStcRebate = pvStcCount * pvStcPrice;
                const batteryStcCount = Math.floor(usableBattery * batteryStcFactor);
                const batteryStcRebate = batteryStcCount * batteryStcPrice;
                const totalDeductions = pvStcRebate + batteryStcRebate + solarVicRebate + solarVicLoan + otherGovSubsidy + otherSubsidy;
                
                const totalCost = systemTotalCost - totalDeductions;
                const finalPrice = systemTotalPrice - totalDeductions;
                const grossProfit = finalPrice - totalCost;
                const grossMargin = finalPrice > 0 ? (grossProfit / finalPrice * 100) : 0;
                
                // 计算自用率：基线自用率 + 电池提升的自用率
                const batteryBoost = usableBattery > 0 ? Math.min(0.5, usableBattery / (annualGeneration / 365) * 0.8) : 0;
                const effectiveSelfConsumption = Math.min(0.95, baselineSc + batteryBoost);
                const npvData = calculateNPV(annualGeneration, effectiveSelfConsumption, finalPrice);
                
                results[key] = {
                    solarKw, panelCount, inverterKw, usableBattery, nominalBattery, annualGeneration,
                    panelLineCost, panelLinePrice, inverterLineCost, inverterLinePrice,
                    batteryLineCost, batteryLinePrice, keyProductsTotalCost, keyProductsTotalPrice,
                    installBaseLineCost, installBaseLinePrice, installPerKwLineCost, installPerKwLinePrice,
                    batteryInstallBaseLineCost, batteryInstallBaseLinePrice,
                    batteryInstallPerKwhLineCost, batteryInstallPerKwhLinePrice,
                    bosTotalCost, bosTotalPrice, additionalCharges, gstPrice, gstCost,
                    systemTotalPrice, systemTotalCost, pvStcRebate, batteryStcRebate,
                    solarVicRebate, solarVicLoan, otherGovSubsidy, otherSubsidy, totalDeductions,
                    totalCost, finalPrice, grossProfit, grossMargin,
                    npv: npvData.npv, paybackYears: npvData.paybackYears, totalSavings: npvData.totalSavings
                };
            });
            
            displayNewSystemResults(results);
            const selectedPlan = document.getElementById('planSelector').value;
            displayNewSystemSteps(selectedPlan, results[selectedPlan]);
        }
        function calculateRetrofit() {
            const roofMaxPower = getVal('roof_max_power_kw');
            const rooftopUseFactor = getVal('rooftop_use_factor');
            const panelPower = getVal('panel_power_kw');
            const batteryDod = getVal('battery_dod');
            const batteryRte = getVal('battery_rte');
            
            const solarKw = roofMaxPower * rooftopUseFactor;
            const panelCount = Math.floor(solarKw / panelPower);
            
            const map = findMapping(RETROFIT_MAPPING, solarKw);
            const plans = {
                A: { usableBattery: map.a },
                B: { usableBattery: map.b },
                C: { usableBattery: map.c }
            };
            
            const results = {};
            Object.entries(plans).forEach(([key, p]) => {
                const nominalBattery = p.usableBattery / batteryDod;
                
                const batteryUnitCostPerKwh = getVal('battery_unit_cost_per_kwh');
                const batteryMargin = getVal('battery_profit_margin');
                const batteryInstallBaseCost = getVal('battery_install_base_cost');
                const batteryInstallCostPerKwh = getVal('battery_install_cost_per_kwh');
                const batteryInstallBaseMargin = getVal('battery_install_base_profit_margin');
                const batteryInstallPerKwhMargin = getVal('battery_install_cost_per_kwh_profit_margin');
                
                const batteryLineCost = nominalBattery * batteryUnitCostPerKwh;
                const batteryLinePrice = batteryLineCost * (1 + batteryMargin);
                const keyProductsTotalCost = batteryLineCost;
                const keyProductsTotalPrice = batteryLinePrice;
                
                const batteryInstallBaseLineCost = batteryInstallBaseCost;
                const batteryInstallBaseLinePrice = batteryInstallBaseLineCost * (1 + batteryInstallBaseMargin);
                const batteryInstallPerKwhLineCost = nominalBattery * batteryInstallCostPerKwh;
                const batteryInstallPerKwhLinePrice = batteryInstallPerKwhLineCost * (1 + batteryInstallPerKwhMargin);
                const bosTotalCost = batteryInstallBaseLineCost + batteryInstallPerKwhLineCost;
                const bosTotalPrice = batteryInstallBaseLinePrice + batteryInstallPerKwhLinePrice;
                
                const additionalCharges = getVal('installer_additional_fee');
                const gstRate = getVal('gst_rate');
                
                const systemTotalPriceBeforeGst = keyProductsTotalPrice + bosTotalPrice + additionalCharges;
                const systemTotalCostBeforeGst = keyProductsTotalCost + bosTotalCost + additionalCharges;
                const gstPrice = systemTotalPriceBeforeGst * gstRate;
                const gstCost = systemTotalCostBeforeGst * gstRate;
                const systemTotalPrice = systemTotalPriceBeforeGst + gstPrice;
                const systemTotalCost = systemTotalCostBeforeGst + gstCost;
                
                const batteryStcFactor = getVal('stc_factor_per_kwh_battery');
                const batteryStcPrice = getVal('battery_stc_price_default');
                const otherGovSubsidy = getVal('other_gov_subsidy');
                const otherSubsidy = getVal('other_subsidy');
                
                const batteryStcCount = Math.floor(p.usableBattery * batteryStcFactor);
                const batteryStcRebate = batteryStcCount * batteryStcPrice;
                const totalDeductions = batteryStcRebate + otherGovSubsidy + otherSubsidy;
                
                const totalCost = systemTotalCost - totalDeductions;
                const finalPrice = systemTotalPrice - totalDeductions;
                const grossProfit = finalPrice - totalCost;
                const grossMargin = finalPrice > 0 ? (grossProfit / finalPrice * 100) : 0;
                
                // 储能扩容：假设已有光伏系统，计算电池带来的额外自用率提升
                const yieldPerKw = getVal('yield_per_kw_per_year');
                const annualGeneration = solarKw * yieldPerKw;
                const baselineSc = getVal('baseline_self_consumption_rate');
                const batteryBoost = p.usableBattery > 0 ? Math.min(0.5, p.usableBattery / (annualGeneration / 365) * 0.8) : 0;
                const effectiveSelfConsumption = Math.min(0.95, baselineSc + batteryBoost);
                const npvData = calculateNPV(annualGeneration, effectiveSelfConsumption, finalPrice);
                
                results[key] = {
                    solarKw, panelCount, usableBattery: p.usableBattery, nominalBattery,
                    batteryLineCost, batteryLinePrice, keyProductsTotalCost, keyProductsTotalPrice,
                    batteryInstallBaseLineCost, batteryInstallBaseLinePrice,
                    batteryInstallPerKwhLineCost, batteryInstallPerKwhLinePrice,
                    bosTotalCost, bosTotalPrice, additionalCharges, gstPrice, gstCost,
                    systemTotalPrice, systemTotalCost, batteryStcRebate, otherGovSubsidy,
                    otherSubsidy, totalDeductions, totalCost, finalPrice, grossProfit, grossMargin,
                    npv: npvData.npv, paybackYears: npvData.paybackYears, totalSavings: npvData.totalSavings
                };
            });
            
            displayRetrofitResults(results);
            const selectedPlan = document.getElementById('planSelector').value;
            displayRetrofitSteps(selectedPlan, results[selectedPlan]);
        }
