<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Agent Lead Review 登录</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
body {
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%);
  color: #0f172a;
}
.container {
  width: 100%;
  max-width: 420px;
  padding: 32px;
  border-radius: 20px;
  background: #ffffff;
  box-shadow: 0 20px 45px rgba(15, 23, 42, 0.12);
}
.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 24px;
}
.logo-badge {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: #312e81;
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  font-size: 18px;
}
.logo-text {
  display: flex;
  flex-direction: column;
}
.logo-text span:first-child {
  font-size: 18px;
  font-weight: 600;
}
.logo-text span:last-child {
  font-size: 13px;
  color: #475569;
}
.title {
  font-size: 26px;
  font-weight: 600;
  margin: 0 0 8px 0;
}
.subtitle {
  margin: 0 0 32px 0;
  color: #475569;
  line-height: 1.5;
}
label {
  display: block;
  font-size: 14px;
  font-weight: 500;
  color: #334155;
  margin-bottom: 8px;
}
input {
  width: 100%;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid #cbd5f5;
  background: #f8fafc;
  font-size: 15px;
  transition: border 0.2s ease, box-shadow 0.2s ease;
}
input:focus {
  outline: none;
  border-color: #4338ca;
  box-shadow: 0 0 0 3px rgba(67, 56, 202, 0.15);
}
input + label {
  margin-top: 18px;
}
.button {
  width: 100%;
  margin-top: 28px;
  background: #4338ca;
  color: #ffffff;
  border: none;
  border-radius: 12px;
  padding: 14px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.button:hover {
  box-shadow: 0 14px 28px rgba(67, 56, 202, 0.22);
  transform: translateY(-1px);
}
.button:active {
  transform: translateY(0);
}
.error {
  margin-top: 18px;
  background: rgba(248, 113, 113, 0.12);
  border-radius: 12px;
  padding: 12px 14px;
  color: #b91c1c;
  font-size: 14px;
  display: none;
}
.footer {
  margin-top: 36px;
  font-size: 13px;
  color: #94a3b8;
  text-align: center;
}
.footer span {
  color: #64748b;
}
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <div class="logo-badge">AI</div>
    <div class="logo-text">
      <span>YourCompany Internal</span>
      <span>AI Agent Lead Review Console</span>
    </div>
  </div>
  <h1 class="title">登录内部审核台</h1>
  <p class="subtitle">仅限授权审核人员访问。请输入内部账号密码以继续。</p>
  <form id="login-form">
    <label for="username">用户名</label>
    <input id="username" type="text" autocomplete="username" required />
    <label for="password">密码</label>
    <input id="password" type="password" autocomplete="current-password" />
    <button class="button" type="submit">登录</button>
  </form>
  <div class="footer">如需重置密码，请联系 <span>ops@yourcompany.com</span></div>
</div>
<script>
const form = document.getElementById("login-form");
const errorMessage = document.getElementById("error-message");
form.addEventListener("submit", (event) => {
  event.preventDefault();
  const username = document.getElementById("username").value.trim();
  if (!username) {
    if (errorMessage) {
      errorMessage.style.display = "block";
      errorMessage.textContent = "请输入用户名";
    }
    return;
  }
  localStorage.setItem("reviewAuthenticated", "true");
  localStorage.setItem("reviewUsername", username);
  window.location.href = "review_v2.html";
});
</script>
</body>
</html>
