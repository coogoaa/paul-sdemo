* {

}
body {

}
.layout {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  background: #1e293b;
  color: #e2e8f0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 32px;
  box-shadow: 0 6px 20px rgba(15, 23, 42, 0.18);
}
.logo-wrap {
  display: flex;
  align-items: center;
  gap: 14px;
}
.logo-badge {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: #4338ca;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  font-size: 17px;
  color: #fff;
}
.logo-title {
  font-size: 18px;
  font-weight: 600;
}
.user-info {
  display: flex;
  align-items: center;
  gap: 18px;
  font-size: 14px;
}
button.logout {
  border: none;
  padding: 10px 16px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.1);
  color: #e0e7ff;
  cursor: pointer;
  transition: background 0.15s ease, transform 0.15s ease;
}
button.logout:hover {
  background: rgba(255, 255, 255, 0.22);
  transform: translateY(-1px);
}
main {
  flex: 1;
  padding: 28px 32px 48px;
}
.page-title {
  font-size: 28px;
  font-weight: 600;
  margin-bottom: 8px;
}
.page-subtitle {
  color: #475569;
  margin-bottom: 26px;
}
.filters {
  background: #ffffff;
  border-radius: 16px;
  padding: 20px 24px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
  margin-bottom: 28px;
}
.filter-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.filter-group label {
  font-size: 13px;
  font-weight: 600;
  color: #475569;
}
.filter-group select,
.filter-group input {
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid #cbd5f5;
  background: #f8fafc;
  font-size: 14px;
  transition: border 0.2s ease, box-shadow 0.2s ease;
}
.filter-group select:focus,
.filter-group input:focus {
  outline: none;
  border-color: #4338ca;
  box-shadow: 0 0 0 3px rgba(67, 56, 202, 0.12);
}
.filters .actions {
  display: flex;
  align-items: flex-end;
}
button.apply {
  padding: 12px 18px;
  border-radius: 12px;
  border: none;
  background: #4338ca;
  color: #fff;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
button.apply:hover {
  box-shadow: 0 12px 26px rgba(67, 56, 202, 0.18);
  transform: translateY(-1px);
}
.table-wrap {
  background: #ffffff;
  border-radius: 18px;
  box-shadow: 0 18px 30px rgba(15, 23, 42, 0.1);
  overflow: hidden;
  overflow-x: auto;
}
.table-header,
.table-row {
  display: grid;
  grid-template-columns: 120px 110px 150px 120px 190px 190px 150px 120px 120px 110px 120px 150px 140px;
  gap: 10px;
  padding: 12px 16px;
  align-items: center;
}
.table-header {
  background: #f8fafc;
  font-size: 11px;
  font-weight: 600;
  color: #475569;
}
.table-header div,
.table-row div {
  font-size: 11px;
}
.table-row {
  border-top: 1px solid #e2e8f0;
  background: #ffffff;
  transition: background 0.15s ease;
}
.table-row:hover {
  background: #eef2ff;
}
.table-row .lead-id {
  font-weight: 600;
  color: #3730a3;
  text-decoration: none;
}
.table-row .lead-id:hover {
  text-decoration: underline;
}
.badge {
  display: inline-flex;
  align-items: center;
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
}
.badge.new {
  background: rgba(79, 70, 229, 0.12);
  color: #4f46e5;
}
.badge.storage {
  background: rgba(16, 185, 129, 0.12);
  color: #059669;
}
.status-badge {
  display: inline-flex;
  align-items: center;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
}
.status-pending {
  background: rgba(67, 56, 202, 0.12);
  color: #4338ca;
}
.status-dispatched {
  background: rgba(22, 163, 74, 0.12);
  color: #15803d;
}
.status-rejected {
  background: rgba(248, 113, 113, 0.16);
  color: #b91c1c;
}
.actions-cell {
  display: flex;
  gap: 8px;
}
.actions-cell button {
  border: none;
  padding: 6px 10px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 11px;
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
}
.actions-cell button:disabled {
  cursor: not-allowed;
  opacity: 0.6;
  box-shadow: none;
  transform: none;
}
.dispatch {
  background: #16a34a;
  color: #ffffff;
}
.dispatch:hover:not(:disabled) {
  box-shadow: 0 12px 24px rgba(22, 163, 74, 0.22);
  transform: translateY(-1px);
}
.reject {
  background: #e2e8f0;
  color: #0f172a;
}
.reject:hover:not(:disabled) {
  background: #cbd5f5;
  transform: translateY(-1px);
}
.empty-state {
  padding: 42px 20px;
  text-align: center;
  color: #94a3b8;
}
.pagination {
  margin-top: 16px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 12px;
  font-size: 12px;
}
.pagination button {
  border: none;
  padding: 8px 14px;
  border-radius: 8px;
  font-weight: 600;
  background: #e2e8f0;
  color: #0f172a;
  cursor: pointer;
  transition: background 0.15s ease, transform 0.15s ease;
}
.pagination button:hover:not(:disabled) {
  background: #cbd5f5;
  transform: translateY(-1px);
}
.pagination button:disabled {
  opacity: 0.55;
  cursor: not-allowed;
  transform: none;
}
.pagination button.active {
  background: #4338ca;
  color: #fff;
}
.pagination-pages {
  display: flex;
  gap: 6px;
}
.pagination .info {
  color: #64748b;
}
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.55);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
  z-index: 50;
}
.modal {
  width: min(900px, 100%);
  max-height: 90vh;
  background: #ffffff;
  border-radius: 18px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.modal-header {
  padding: 20px 24px;
  border-bottom: 1px solid #e2e8f0;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-title {

  font-weight: 600;
}
.modal-body {

}
.modal-actions {

  justify-content: flex-end;

.modal-close {

      notes: "客户询问补贴政策细节",
      cardUrl: "../demo0925/assets/card-storage-D.png"
    }
  }
];

let filteredLeads = [...leads];
let pagedLeads = [];
let currentPage = 1;
const PAGE_SIZE = 5;

function populateInstallerFilter() {
  const options = new Set(["all"]);
  leads.forEach((lead) => options.add(lead.installer));
  installerFilter.innerHTML = "";
  Array.from(options).forEach((value) => {
    const option = document.createElement("option");
    option.value = value;
    option.textContent = value === "all" ? "全部安装商" : value;
    installerFilter.appendChild(option);
  });
}

function statusLabel(lead) {
  if (lead.status === STATUS_DISPATCHED) {
    return `已分发至 ${lead.installer}`;
  }
  if (lead.status === STATUS_REJECTED) {
    return `已拒绝${lead.rejectReason ? `（${lead.rejectReason}）` : ""}`;
  }
  return "待审核";
}

function updateEmailHtml(lead) {
  lead.emailHtml = formatEmailTemplate(lead);
}

leads.forEach(updateEmailHtml);

function ensureAuthenticated() {
  const authed = localStorage.getItem("reviewAuthenticated");
  const username = localStorage.getItem("reviewUsername");
  if (!authed) {
    window.location.href = "login.html";
    return;
  }
  userGreeting.textContent = username ? `审核员：${username}` : "审核员";
}

function applyFilters(resetPage = true) {
  const statusValue = statusFilter.value;
  const installerValue = installerFilter.value;
  const keyword = searchInput.value.trim().toLowerCase();
  filteredLeads = leads.filter((lead) => {
    if (statusValue !== "all" && lead.status !== statusValue) return false;
    if (installerValue !== "all" && lead.installer !== installerValue) return false;
    if (keyword) {
      const combined = `${lead.id} ${lead.customer}`.toLowerCase();
      if (!combined.includes(keyword)) return false;
    }
    return true;
  });
  if (resetPage) {
    currentPage = 1;
  } else {
    const totalPages = Math.max(1, Math.ceil(filteredLeads.length / PAGE_SIZE));
    if (currentPage > totalPages) currentPage = totalPages;
  }
  paginateAndRender();
}

function paginateAndRender() {
  const total = filteredLeads.length;
  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage - 1) * PAGE_SIZE;
  const end = start + PAGE_SIZE;
  pagedLeads = filteredLeads.slice(start, end);
  renderTable();
  renderPagination(total, totalPages);
}

function renderPagination(total, totalPages) {
  if (total <= PAGE_SIZE) {
    pagination.style.display = "none";
    return;
  }
  pagination.style.display = "flex";
  prevPageBtn.disabled = currentPage === 1;
  nextPageBtn.disabled = currentPage === totalPages;
  pageInfo.textContent = `共 ${total} 条`;
  const pagesWrapper = pagination.querySelector(".pagination-pages");
  pagesWrapper.innerHTML = "";
  for (let page = 1; page <= totalPages; page += 1) {
    const button = document.createElement("button");
    button.textContent = `${page}`;
    if (page === currentPage) {
      button.classList.add("active");
    }
    button.addEventListener("click", () => {
      if (currentPage !== page) {
        currentPage = page;
        paginateAndRender();
      }
    });
    pagesWrapper.appendChild(button);
  }
}

function renderTable() {
  tableBody.innerHTML = "";
  if (filteredLeads.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty-state";
    empty.textContent = "暂无符合条件的线索";
    tableBody.appendChild(empty);
    return;
  }
  pagedLeads.forEach((lead) => {
    const row = createRow(lead);
    tableBody.appendChild(row);
  });
}

function createRow(lead) {
  const row = document.createElement("div");
  row.className = "table-row";
  const leadLink = document.createElement("a");
  leadLink.href = "#";
  leadLink.textContent = lead.id;
  leadLink.className = "lead-id";
  leadLink.addEventListener("click", (event) => {
    event.preventDefault();
    openModal(lead);
  });
  const planBadge = document.createElement("span");
  planBadge.className = `badge ${lead.planType === "新建系统" ? "new" : "storage"}`;
  planBadge.textContent = lead.planType;
  const statusBadge = document.createElement("span");
  statusBadge.className = "status-badge";
  if (lead.status === STATUS_PENDING) statusBadge.classList.add("status-pending");
  if (lead.status === STATUS_DISPATCHED) statusBadge.classList.add("status-dispatched");
  if (lead.status === STATUS_REJECTED) statusBadge.classList.add("status-rejected");
  statusBadge.textContent = statusLabel(lead);
  const actionsDiv = document.createElement("div");
  actionsDiv.className = "actions-cell";
  const dispatchBtn = document.createElement("button");
  dispatchBtn.className = "dispatch";
  dispatchBtn.textContent = lead.status === STATUS_DISPATCHED ? "已通过" : "通过";
  dispatchBtn.disabled = lead.status === STATUS_DISPATCHED;
  dispatchBtn.addEventListener("click", () => dispatchLead(lead.id));
  const rejectBtn = document.createElement("button");
  rejectBtn.className = "reject";
  rejectBtn.textContent = lead.status === STATUS_REJECTED ? "已拒绝" : "拒绝";
  rejectBtn.disabled = lead.status === STATUS_REJECTED;
  rejectBtn.addEventListener("click", () => rejectLead(lead.id));
  actionsDiv.appendChild(dispatchBtn);
  actionsDiv.appendChild(rejectBtn);

  const quoteText = lead.quote || lead.templateData.upfrontInvestment;
  const rebateText = lead.rebate || `A$${lead.templateData.rebateAmount}`;
  [leadLink, lead.generatedAt, lead.installer, planBadge, lead.planName, lead.system, quoteText, rebateText, lead.savings, lead.irr, lead.payback, statusBadge, actionsDiv].forEach((item) => {
    const cell = document.createElement("div");
    if (item instanceof HTMLElement) {
      cell.appendChild(item);
    } else {
      cell.textContent = item;
    }
    row.appendChild(cell);
  });
  return row;
}

function renderTable() {
  tableBody.innerHTML = "";
  if (filteredLeads.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty-state";
    empty.textContent = "暂无符合条件的线索";
    tableBody.appendChild(empty);
    return;
  }
  pagedLeads.forEach((lead) => {
    const row = createRow(lead);
    tableBody.appendChild(row);
  });
}

function openModal(lead) {
  modalTitle.textContent = `线索详情：${lead.id}`;
  const wrapper = document.createElement("div");
  wrapper.className = "email-template";
  wrapper.textContent = lead.emailHtml;
  modalContent.innerHTML = "";
  modalContent.appendChild(wrapper);
  modalBackdrop.style.display = "flex";
}

function closeModal() {
  modalBackdrop.style.display = "none";
}

function dispatchLead(leadId) {
  const lead = leads.find((item) => item.id === leadId);
  if (!lead || lead.status === STATUS_DISPATCHED) return;
  lead.status = STATUS_DISPATCHED;
  updateEmailHtml(lead);
  alert(`已通过 ${lead.id}`);
  applyFilters(false);
}

function rejectLead(leadId) {
  const lead = leads.find((item) => item.id === leadId);
  if (!lead || lead.status === STATUS_REJECTED) return;
  const reason = prompt("请输入拒绝原因：", lead.rejectReason || "资料不完整");
  if (reason === null) return;
  lead.status = STATUS_REJECTED;
  lead.rejectReason = reason.trim();
  updateEmailHtml(lead);
  alert(`已拒绝 ${lead.id}`);
  applyFilters(false);
}

modalCloseBtn.addEventListener("click", closeModal);
modalBackdrop.addEventListener("click", (event) => {
  if (event.target === modalBackdrop) {
    closeModal();
  }
});

logoutBtn.addEventListener("click", () => {
  localStorage.removeItem("reviewAuthenticated");
  localStorage.removeItem("reviewUsername");
  window.location.href = "login.html";
});

applyFiltersBtn.addEventListener("click", () => applyFilters(true));
statusFilter.addEventListener("change", () => applyFilters(true));
installerFilter.addEventListener("change", () => applyFilters(true));
searchInput.addEventListener("keydown", (event) => {
  if (event.key === "Enter") {
    event.preventDefault();
    applyFilters(true);
  }
});

prevPageBtn.addEventListener("click", () => {
  if (currentPage > 1) {
    currentPage -= 1;
    paginateAndRender();
  }
});

nextPageBtn.addEventListener("click", () => {
  const totalPages = Math.max(1, Math.ceil(filteredLeads.length / PAGE_SIZE));
  if (currentPage < totalPages) {
    currentPage += 1;
    paginateAndRender();
  }
});

function formatEmailTemplate(lead) {
  const data = lead.templateData;
  return `Subject: Action Needed – Sales Agent to Confirm Site & Finalize Quote (${data.systemSize} / ${data.planCategory})
------
Dear ${data.installerCompany},
Based on the customer’s address and initial roof analysis, an AI-assisted Preliminary Proposal has been prepared for your review.
Please verify the site details, confirm rebate eligibility, and schedule a roof inspection to finalise the system design and pricing.

Payback Period: ${data.paybackPeriod} years Payback Period

System Details

Battery Capacity: ${data.batteryCapacity}

Customer & Site Info

Phone: ${data.customerPhone}
Email: ${data.customerEmail}
Address: ${data.address} ，${data.coordinates}
Notes: ${lead.status === STATUS_REJECTED && lead.rejectReason ? lead.rejectReason : data.notes}

Shareable Asset
Preview Card: attached “share card.png” (${data.cardUrl})

⚡ Next Steps

Please act promptly to move the proposal forward:

Disclaimer:
All figures are inclusive of tax and based on preliminary assumptions.
Final pricing and performance outcomes depend on on-site verification and regional policy approval.
Best regards,
The OSW AI Agent Team`;
}

document.addEventListener("DOMContentLoaded", () => {
  ensureAuthenticated();
  populateInstallerFilter();
  applyFilters();
});
</script>
