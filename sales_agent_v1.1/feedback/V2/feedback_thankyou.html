<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#22C55E">
    <title>Thank You - Emily's Smart Quote</title>
    <link id="interCss" href="../../vendor/inter/inter.css" rel="stylesheet" onerror="this.onerror=null; this.href='https://rsms.me/inter/inter.css'">
    <script src="../../vendor/tailwind/tailwind.cdn.min.js"></script>
    <script>
        if (!window.tailwind) {
            var s = document.createElement('script');
            s.src = 'https://cdn.tailwindcss.com';
            document.head.appendChild(s);
        }
    </script>
    <script src="../../vendor/lucide/lucide.min.js" onerror="this.onerror=null; this.src='https://unpkg.com/lucide@latest'"></script>
    <style>
        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        body { background-color: #FAFFFE; }
        @media (min-width: 768px) {
            body { background-image: linear-gradient(to bottom right, #f0fdf4, #f7fee7); }
            .responsive-container { max-width: 28rem; margin: 4rem auto; padding: 2rem; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); border-radius: 1.5rem; background-color: white; border: 1px solid #e5e7eb; }
        }
    </style>
</head>
<body class="text-gray-800 min-h-screen font-sans flex flex-col items-center justify-center" style="font-family: 'InterVariable', 'Inter', sans-serif;">

    <div class="responsive-container w-full max-w-md p-6 fade-in text-center space-y-6">
        <div class="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mx-auto shadow-sm ring-8 ring-green-50">
            <i data-lucide="check" class="w-12 h-12 text-green-600"></i>
        </div>
        
        <div class="space-y-2">
            <h2 class="text-2xl font-bold text-gray-900">Thank You!</h2>
            <p class="text-gray-600 leading-relaxed px-4">
                Your feedback has been received.<br>
                It helps us ensure you get the best possible solar experience.
            </p>
        </div>
        
        <div class="mt-8 pt-4 space-y-2">
             <img src="../pic/emily_logo.png" alt="Emily Logo" class="h-9 w-9 rounded-xl object-contain bg-white border border-green-100 p-1 mx-auto">
             <div class="mt-1 space-y-0.5">
                 <div class="text-[11px] font-semibold text-gray-700">Emily's Smart Quote</div>
                 <div class="text-[10px] text-gray-500">Scan for your AI-powered solar proposal tailored just for you.</div>
             </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
